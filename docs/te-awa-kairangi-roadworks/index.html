<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive weekly map of the SH2 Melling Transport Improvements / Te Wai Takamori o Te Awa Kairangi roadworks in Lower Hutt.">
<title>Te Awa Kairangi Roadworks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EEF1F0; --panel:#FFFFFF; --ink:#18262B; --ink-2:#4B5A60; --ink-3:#7B888D; --rule:#D7DDDC;
  --accent:#1E6B75; --accent-ink:#FFFFFF;
  --map-ground:#E8ECEA; --map-road:#FFFFFF; --map-case:#C9D0CF; --map-water:#B6D2DE; --map-park:#D5E3D3; --map-rail:#9AA6A9; --map-label:#5B6A70; --map-halo:#E8ECEA;
  --c-closed:#C4302B; --c-oneway:#D9640F; --c-tm:#D89B12; --c-night:#4D4BAF; --c-parking:#2B8A80; --c-path:#6B8E23; --c-longterm:#5A6670; --c-works:#8A6A3E; --c-detour:#1E6B75;
  --new:#1E6B75; --removed:#9E3B36;
  --shadow:0 2px 10px rgba(24,38,43,.12);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#121A1D; --panel:#1A2427; --ink:#E6ECEC; --ink-2:#B3BFC2; --ink-3:#7F8E93; --rule:#2D3A3E;
  --accent:#5CB8C2; --accent-ink:#0E1A1C;
  --map-ground:#1B2528; --map-road:#334044; --map-case:#12191B; --map-water:#1F3B49; --map-park:#213128; --map-rail:#5C6B70; --map-label:#A9B6BA; --map-halo:#1B2528;
  --c-closed:#F0665F; --c-oneway:#F28B3B; --c-tm:#E9B93C; --c-night:#8C8AE8; --c-parking:#4FC0B4; --c-path:#A3C85A; --c-longterm:#98A5AE; --c-works:#C9A26E; --c-detour:#5CB8C2;
  --new:#5CB8C2; --removed:#F08A84; --shadow:0 2px 12px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --ground:#121A1D; --panel:#1A2427; --ink:#E6ECEC; --ink-2:#B3BFC2; --ink-3:#7F8E93; --rule:#2D3A3E;
  --accent:#5CB8C2; --accent-ink:#0E1A1C;
  --map-ground:#1B2528; --map-road:#334044; --map-case:#12191B; --map-water:#1F3B49; --map-park:#213128; --map-rail:#5C6B70; --map-label:#A9B6BA; --map-halo:#1B2528;
  --c-closed:#F0665F; --c-oneway:#F28B3B; --c-tm:#E9B93C; --c-night:#8C8AE8; --c-parking:#4FC0B4; --c-path:#A3C85A; --c-longterm:#98A5AE; --c-works:#C9A26E; --c-detour:#5CB8C2;
  --new:#5CB8C2; --removed:#F08A84; --shadow:0 2px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh;min-height:100vh}
/* header */
.hdr{display:flex;align-items:center;gap:20px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--panel);flex-wrap:wrap}
.hdr h1{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:24px;letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
.hdr h1 small{display:block;font-family:Barlow,sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.weeknav{display:flex;align-items:center;gap:6px;margin-left:auto}
.weeknav .wk{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;min-width:220px;text-align:center;font-variant-numeric:tabular-nums}
.weeknav .wk span{display:block;font-family:Barlow,sans-serif;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.iconbtn{width:34px;height:34px;border-radius:6px;border:1px solid var(--rule);display:grid;place-items:center;background:var(--panel)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn:disabled:hover{border-color:var(--rule);color:inherit}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--ink-2);padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--panel)}
.toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.toggle .dot{width:10px;height:10px;border-radius:50%;background:var(--new)}
/* body */
.main{display:grid;grid-template-columns:360px 1fr;min-height:0}
.side{border-right:1px solid var(--rule);background:var(--panel);overflow-y:auto;min-height:0}
.side section{padding:14px 16px 6px}
.side h2{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.side h2 b{font-family:Barlow,sans-serif;font-weight:600;font-size:12px;color:var(--ink);background:var(--ground);border-radius:10px;padding:1px 7px}
.item{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:8px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--ground)}
.item.active{border-color:var(--accent);background:var(--ground)}
.item .sw{width:14px;height:14px;border-radius:3px;margin-top:3px;background:var(--c)}
.item .sw.point{border-radius:50%}
.item .sw.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.item .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.item .wh{font-size:12px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.item .tx{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.item .who{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.chg{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:1px}
.chg.new{color:var(--accent-ink);background:var(--new)}
.chg.upd{color:var(--accent);border:1px solid var(--accent)}
.item.gone{opacity:.7}
.item.gone .nm{text-decoration:line-through;text-decoration-color:var(--removed)}
.chg.gone{color:#fff;background:var(--removed)}
.region .r{padding:7px 6px;border-top:1px solid var(--rule)}
.region .r:first-of-type{border-top:0}
.region .r b{display:block;font-size:12.5px}
.region .r span{font-size:12px;color:var(--ink-2)}
.note{font-size:12px;color:var(--ink-2);padding:10px 16px 18px;border-top:1px solid var(--rule)}
.note a{color:var(--accent)}
/* map */
.mapwrap{position:relative;min-height:0;background:var(--map-ground);overflow:hidden}
svg.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.map.drag{cursor:grabbing}
.water{fill:var(--map-water)} .park{fill:var(--map-park)}
.road-S{stroke:var(--map-road);stroke-width:2.2px} .road-M{stroke:var(--map-road);stroke-width:3.6px} .road-H{stroke:var(--map-road);stroke-width:6px}
.case-S{stroke:var(--map-case);stroke-width:3px} .case-M{stroke:var(--map-case);stroke-width:4.8px} .case-H{stroke:var(--map-case);stroke-width:7.6px}
.rail{stroke:var(--map-rail);stroke-width:1.6px;stroke-dasharray:6 4}
.road-S,.road-M,.road-H,.case-S,.case-M,.case-H,.rail,.wline,.whalo{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.whalo{stroke:var(--map-ground);stroke-width:11px;opacity:.85}
.wline{stroke:var(--c);stroke-width:5.5px;pointer-events:stroke;cursor:pointer}
.wline.detour{stroke-width:3.5px;stroke-dasharray:8 6}
.wline.longterm{stroke-width:6px;stroke-dasharray:2 7;stroke-linecap:butt}
.wline.path{stroke-width:3.5px;stroke-dasharray:1 6}
.wpoly{fill:var(--c);fill-opacity:.35;stroke:var(--c);stroke-width:1.5px;vector-effect:non-scaling-stroke;cursor:pointer}
.work.dim{opacity:.22}
.work.hi .wline{stroke-width:9px} .work.hi .wline.detour{stroke-width:6px}
.work.hi .whalo{stroke:var(--panel);stroke-width:15px;opacity:1}
.lbl{font-family:Barlow,sans-serif;font-size:11px;font-weight:500;fill:var(--map-label);paint-order:stroke;stroke:var(--map-halo);stroke-width:3px;stroke-linejoin:round;pointer-events:none;letter-spacing:.02em}
.lbl.big{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.lbl.water{fill:#3E6E82;font-style:italic;font-weight:400;stroke:var(--map-water)}
.pin{cursor:pointer}
.pin circle{fill:var(--c);stroke:var(--panel);stroke-width:2.5px}
.pin.hi circle{stroke:var(--ink);stroke-width:3px}
.pin text{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:11px;fill:#fff;text-anchor:middle;pointer-events:none}
.pin .ring{fill:none;stroke:var(--c);stroke-width:1.5px;opacity:.5}
.chgring{fill:none;stroke:var(--new);stroke-width:2px;stroke-dasharray:3 3}
/* controls */
.ctl{position:absolute;display:flex;flex-direction:column;gap:6px;top:12px;right:12px}
.ctl button{width:34px;height:34px;border-radius:6px;background:var(--panel);box-shadow:var(--shadow);font-size:20px;font-weight:500;display:grid;place-items:center;color:var(--ink)}
.ctl button:hover{color:var(--accent)}
.legend{position:absolute;left:12px;bottom:12px;background:var(--panel);box-shadow:var(--shadow);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:11.5px;color:var(--ink-2)}
.legend div{display:flex;align-items:center;gap:7px;white-space:nowrap}
.legend i{width:16px;height:5px;border-radius:2px;background:var(--c);flex:none}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 3px,transparent 3px 6px)}
.legend i.dot{width:9px;height:9px;border-radius:50%}
.card{position:absolute;left:12px;top:12px;max-width:320px;background:var(--panel);box-shadow:var(--shadow);border-radius:8px;padding:12px 14px;display:none;border-top:4px solid var(--c)}
.card.on{display:block}
.card h3{margin:0 0 2px;font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:600;line-height:1.1}
.card .wh{color:var(--accent);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.card p{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.card .src{font-size:11px;color:var(--ink-3);margin-top:8px}
.card .x{position:absolute;right:6px;top:4px;font-size:18px;line-height:1;color:var(--ink-3);padding:4px}
.scale{position:absolute;right:12px;bottom:12px;font-size:10.5px;color:var(--ink-2);background:var(--panel);padding:3px 8px;border-radius:4px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.scale i{display:block;height:3px;background:var(--ink-2);margin-top:2px}
.attrib{position:absolute;right:12px;bottom:44px;font-size:10px;color:var(--ink-3)}
@media (max-width:820px){
  .app{height:auto;min-height:100dvh}
  .main{grid-template-columns:1fr;grid-template-rows:62vh auto}
  .mapwrap{order:-1;min-height:62vh}
  .side{border-right:0;border-top:1px solid var(--rule);max-height:none}
  .weeknav{margin-left:0;width:100%}
  .weeknav .wk{flex:1;min-width:0}
  .legend{display:none}
}
@media (prefers-reduced-motion:no-preference){ .item,.iconbtn,.toggle{transition:background .15s,border-color .15s,color .15s} }
</style>
</head>

<script>
// ---- projection (local metres, equirectangular around the CBD) ----
const LAT0=-41.206, LON0=174.905, KX=111320*Math.cos(LAT0*Math.PI/180), KY=111320;
const P=(ll)=>[ (ll[1]-LON0)*KX, -(ll[0]-LAT0)*KY ];
const pathOf=(pts,close)=>pts.map((p,i)=>(i?'L':'M')+P(p).map(v=>v.toFixed(1)).join(' ')).join('')+(close?'Z':'');

const CATS={
  closed:{label:'Road / lane closed',sw:'line'}, oneway:{label:'One-way only',sw:'line'}, tm:{label:'Traffic management · delays',sw:'line'},
  night:{label:'Night works',sw:'line'}, parking:{label:'Reduced parking',sw:'line'}, path:{label:'Footpath / trail closed',sw:'dash'},
  longterm:{label:'Long-term closure (to ~2029)',sw:'dash'}, works:{label:'Other works',sw:'line'}, detour:{label:'Signed detour',sw:'dash'}
};
const cvar=c=>`var(--c-${c})`;

// ---- state ----
let wi = UPDATES.length-1, showDiff=false, activeSite=null;
const svg=document.getElementById('map'), world=document.getElementById('world'), base=document.getElementById('base'), worksG=document.getElementById('works'), overlay=document.getElementById('overlay'), wrap=document.getElementById('mapwrap');
let view={s:1,tx:0,ty:0};

// ---- basemap ----
(function drawBase(){
  const order={W:0,G:1,R:2,S:3,M:4,H:5};
  const items=[...BASEMAP].sort((a,b)=>order[a[0]]-order[b[0]]);
  let html='';
  for(const [c,n,pts] of items){
    if(c==='C') continue;
    if(c==='W') html+=`<path class="water" d="${pathOf(pts,true)}"/>`;
    else if(c==='G') html+=`<path class="park" d="${pathOf(pts,true)}"/>`;
    else if(c==='R') html+=`<path class="rail" d="${pathOf(pts)}"/>`;
  }
  for(const cls of ['S','M','H']) for(const [c,n,pts] of items) if(c===cls) html+=`<path class="case-${c}" d="${pathOf(pts)}"/>`;
  for(const cls of ['S','M','H']) for(const [c,n,pts] of items) if(c===cls) html+=`<path class="road-${c}" d="${pathOf(pts)}"/>`;
  base.innerHTML=html;
})();

// ---- labels: pick the longest way of each named street, label at its midpoint ----
const LABEL_NAMES=['Western Hutt Road','Melling Link','Rutherford Street','Queens Drive','High Street','Marsden Street','Daly Street','Dudley Street','Margaret Street','Connolly Street','Mills Street','Pharazyn Street','Bridge Street','Railway Avenue','Normandale Road','Tirohanga Road','Harbour View Road','Cambridge Terrace','Waterloo Road','Knights Road','Andrews Avenue','Cuba Street','Hutt Road','Kings Crescent','Naenae Road','Oxford Terrace'];
const RENAME={'Western Hutt Road':'SH2 · Western Hutt Rd'};
const labels=[];
(function(){
  const best={};
  for(const [c,n,pts] of BASEMAP){ if(!LABEL_NAMES.includes(n)) continue; let len=0; for(let i=1;i<pts.length;i++){const a=P(pts[i-1]),b=P(pts[i]);len+=Math.hypot(b[0]-a[0],b[1]-a[1]);} if(!best[n]||len>best[n].len) best[n]={len,pts,c}; }
  for(const n in best){ const {pts}=best[n]; // midpoint by length
    let tot=0,segs=[]; for(let i=1;i<pts.length;i++){const a=P(pts[i-1]),b=P(pts[i]);const l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push([a,b,l]);tot+=l;}
    let h=tot/2; for(const [a,b,l] of segs){ if(h<=l){const t=h/l; let ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI; if(ang>90||ang<-90) ang+=180; labels.push({x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,ang,text:RENAME[n]||n,cls:best[n].c==='H'?'big':''}); break;} h-=l; }
  }
  labels.push({x:P([-41.2005,174.9150])[0],y:P([-41.2005,174.9150])[1],ang:-58,text:'Te Awa Kairangi / Hutt River',cls:'water'});
  labels.push({x:P([-41.2170,174.8975])[0],y:P([-41.2170,174.8975])[1],ang:-25,text:'Te Awa Kairangi / Hutt River',cls:'water'});
  for(const [t,ll] of [['Ewen Bridge',[-41.2129,174.8979]],['Kennedy Good Bridge',[-41.1924,174.9306]],['Melling Station (closed)',[-41.2050,174.9006]],['Riverbank car park',[-41.2085,174.9020]],['Lower Hutt CBD',[-41.2110,174.9040]]]){const p=P(ll);labels.push({x:p[0],y:p[1],ang:0,text:t,cls:'poi'});}
})();

// ---- works rendering ----
function currentItems(){ const u=UPDATES[wi]; return u.items; }
function prevItems(){ return wi>0?UPDATES[wi-1].items:null; }
function diffOf(){ const prev=prevItems(); if(!prev) return {added:new Set(),removed:[],changed:new Set()};
  const pm=new Map(prev.map(i=>[i.site,i])), cm=new Map(currentItems().map(i=>[i.site,i]));
  const added=new Set(), changed=new Set(); for(const [s,i] of cm){ if(!pm.has(s)) added.add(s); else if(pm.get(s).text!==i.text||pm.get(s).when!==i.when) changed.add(s); }
  const removed=[...pm.values()].filter(i=>!cm.has(i.site)); return {added,removed,changed}; }

function drawWorks(){
  const d=diffOf(); const items=currentItems(); let html='';
  const draw=(site,id,extra)=>{ const S=SITES[id]; if(!S||!S.geom) return; const g=S.geom; const cat=S.cat; const lines=g.lines?[...g.lines]:[]; if(g.line) lines.push(g.line);
    html+=`<g class="work${extra||''}" data-site="${id}" style="--c:${cvar(cat)}">`;
    for(const ln of lines){ html+=`<path class="whalo" d="${pathOf(ln)}"/><path class="wline ${cat}" d="${pathOf(ln)}"/>`; }
    if(g.poly) html+=`<path class="wpoly" d="${pathOf(g.poly,true)}"/>`;
    html+=`</g>`; };
  for(const lt of LONG_TERM) draw(lt,lt.site,'');
  for(const it of items) draw(it,it.site,'');
  worksG.innerHTML=html;
  worksG.querySelectorAll('.work').forEach(el=>{ el.addEventListener('mouseenter',()=>hover(el.dataset.site,true)); el.addEventListener('mouseleave',()=>hover(el.dataset.site,false)); });
  drawOverlay(); applyDim();
}
function pointsForPins(){ const out=[]; const push=(id,i)=>{const S=SITES[id]; if(S&&S.geom&&S.geom.point) out.push({id,ll:S.geom.point,cat:S.cat});};
  LONG_TERM.forEach(l=>push(l.site)); currentItems().forEach(i=>push(i.site)); return out; }

function drawOverlay(){ // constant-size things: labels, pins, change rings
  const {s,tx,ty}=view; const T=(x,y)=>[x*s+tx,y*s+ty]; let html='';
  for(const L of labels){ if(L.cls==='poi'&&s<0.5) continue; if(!L.cls&&s<0.32) continue; const [x,y]=T(L.x,L.y); html+=`<text class="lbl ${L.cls==='poi'?'':L.cls}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${L.ang.toFixed(1)})" text-anchor="middle" dy="${L.cls==='poi'?'-6':'-4'}">${L.text}</text>`; }
  const d=diffOf(); const pins=pointsForPins();
  for(const p of pins){ const [px,py]=T(...P(p.ll)); const ch=showDiff&&(d.added.has(p.id)||d.changed.has(p.id)); html+=`<g class="pin${activeSite===p.id?' hi':''}" data-site="${p.id}" style="--c:${cvar(p.cat)}" transform="translate(${px.toFixed(1)} ${py.toFixed(1)})">${ch?'<circle class="chgring" r="16"/>':''}<circle class="ring" r="11"/><circle r="7"/><text dy="3.5">${p.cat==='longterm'?'×':p.cat==='night'?'☾':p.cat==='path'?'×':'!'}</text></g>`; }
  if(showDiff){ for(const id of [...d.added,...d.changed]){ const S=SITES[id]; if(!S||!S.geom||S.geom.point) continue; const ln=S.geom.line||(S.geom.lines&&S.geom.lines[0])||S.geom.poly; if(!ln) continue; const m=ln[Math.floor(ln.length/2)]; const [x,y]=T(...P(m)); html+=`<circle class="chgring" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="14"/>`; } }
  overlay.innerHTML=html;
  overlay.querySelectorAll('.pin').forEach(el=>{ el.addEventListener('click',e=>{e.stopPropagation();select(el.dataset.site);}); });
}
function applyDim(){ const d=diffOf(); worksG.querySelectorAll('.work').forEach(el=>{ const id=el.dataset.site; el.classList.toggle('hi',activeSite===id); el.classList.toggle('dim', showDiff ? !(d.added.has(id)||d.changed.has(id)) : (activeSite&&activeSite!==id)); }); }

// ---- view / pan / zoom ----
function setView(v){ view=v; world.setAttribute('transform',`translate(${v.tx} ${v.ty}) scale(${v.s})`); drawOverlay(); const m=200*v.s; document.querySelector('#scale i').style.width=m+'px'; }
function fit(){ const W=wrap.clientWidth,H=wrap.clientHeight; const ll1=P([-41.2005,174.8920]), ll2=P([-41.2145,174.9170]); const bw=ll2[0]-ll1[0], bh=ll2[1]-ll1[1]; const s=Math.min(W/bw,H/bh)*0.92; setView({s,tx:(W-bw*s)/2-ll1[0]*s,ty:(H-bh*s)/2-ll1[1]*s}); }
function zoomAt(f,cx,cy){ const s=Math.max(0.15,Math.min(8,view.s*f)); const k=s/view.s; setView({s,tx:cx-(cx-view.tx)*k,ty:cy-(cy-view.ty)*k}); }
document.getElementById('zin').onclick=()=>zoomAt(1.5,wrap.clientWidth/2,wrap.clientHeight/2);
document.getElementById('zout').onclick=()=>zoomAt(1/1.5,wrap.clientWidth/2,wrap.clientHeight/2);
document.getElementById('zfit').onclick=fit;
svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null, pinch=null; const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{ ptrs.set(e.pointerId,[e.clientX,e.clientY]); svg.setPointerCapture(e.pointerId); if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,moved:false};svg.classList.add('drag');} else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s:view.s}; drag=null; } });
svg.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); const r=svg.getBoundingClientRect(); const cx=(a[0]+b[0])/2-r.left, cy=(a[1]+b[1])/2-r.top; const s=Math.max(0.15,Math.min(8,pinch.s*d/pinch.d)); const k=s/view.s; setView({s,tx:cx-(cx-view.tx)*k,ty:cy-(cy-view.ty)*k}); return; }
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; setView({s:view.s,tx:drag.tx+dx,ty:drag.ty+dy}); } });
const endPtr=e=>{ ptrs.delete(e.pointerId);
  if(drag&&!drag.moved&&e.type==='pointerup'){ const el=document.elementFromPoint(e.clientX,e.clientY); const hit=el&&el.closest&&el.closest('.work,.pin'); select(hit?hit.dataset.site:null); }
  drag=null; pinch=null; svg.classList.remove('drag'); };
svg.addEventListener('pointerup',endPtr); svg.addEventListener('pointercancel',endPtr);
window.addEventListener('resize',()=>drawOverlay());

// ---- selection ----
function hover(id,on){ if(activeSite) return; worksG.querySelectorAll('.work').forEach(el=>el.classList.toggle('hi',on&&el.dataset.site===id)); }
function select(id, pan){ activeSite=id; applyDim(); drawOverlay();
  document.querySelectorAll('.item').forEach(el=>el.classList.toggle('active',el.dataset.site===id));
  const card=document.getElementById('card');
  if(!id){card.classList.remove('on');return;}
  const S=SITES[id]; const it=currentItems().find(i=>i.site===id)||LONG_TERM.find(l=>l.site===id); const u=UPDATES[wi];
  card.style.setProperty('--c',cvar(S.cat));
  card.innerHTML=`<button class="x" aria-label="Close">×</button><h3>${S.name}</h3><div class="wh">${it.when||'Long-term closure'}${it.who?' · '+it.who:''}</div><p>${it.text}</p><div class="src">${CATS[S.cat].label} · from the ${fmtDate(u.emailDate)} email${S.geom&&S.geom.line&&id==='river_trail_west'?' · alignment approximate':''}</div>`;
  card.classList.add('on'); card.querySelector('.x').onclick=()=>select(null);
  const el=document.querySelector(`.item[data-site="${id}"]`); if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(pan&&S.geom){ const g=S.geom; let pts=g.point?[g.point]:(g.line||g.poly||(g.lines&&g.lines.flat())); if(pts){ const xs=pts.map(p=>P(p)); const cx=xs.reduce((a,p)=>a+p[0],0)/xs.length, cy=xs.reduce((a,p)=>a+p[1],0)/xs.length; const W=wrap.clientWidth,H=wrap.clientHeight; const s=Math.max(view.s,1.2); setView({s,tx:W/2-cx*s,ty:H/2-cy*s}); } }
}

// ---- sidebar ----
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short'});
const fmtWeek=d=>{const a=new Date(d+'T12:00:00'),b=new Date(a);b.setDate(a.getDate()+6);return `${a.toLocaleDateString('en-NZ',{day:'numeric',month:'short'})} – ${b.toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'})}`;};
function renderSide(){
  const u=UPDATES[wi], d=diffOf(); const side=document.getElementById('side');
  document.getElementById('wk').innerHTML=`<span>Week commencing Sunday</span>${fmtWeek(u.week)}`;
  document.getElementById('prev').disabled=wi===0; document.getElementById('next').disabled=wi===UPDATES.length-1;
  const chip=id=>showDiff&&wi>0?(d.added.has(id)?'<span class="chg new">New</span>':d.changed.has(id)?'<span class="chg upd">Updated</span>':''):'';
  const row=(it,long)=>{ const S=SITES[it.site]; const c=CATS[S.cat]; const pt=S.geom&&S.geom.point&&!S.geom.lines; return `<div class="item" data-site="${it.site}" tabindex="0" role="button" style="--c:${cvar(S.cat)}"><div class="sw ${pt?'point':c.sw==='dash'?'dash':''}"></div><div><div class="nm">${S.name}${chip(it.site)}</div>${it.when?`<div class="wh">${it.when}</div>`:''}<div class="tx">${it.text}</div>${it.who?`<div class="who">${it.who}</div>`:''}${!S.geom?'<div class="who">Not mapped</div>':S.offmap?'<div class="who">Outside the main map — click to pan</div>':''}</div></div>`; };
  const local=u.items.filter(i=>!SITES[i.site].offmap), elsewhere=u.items.filter(i=>SITES[i.site].offmap);
  let html=`<section><h2>This week in Lower Hutt <b>${local.length}</b></h2>${local.map(i=>row(i)).join('')}`;
  if(showDiff&&d.removed.length) html+=d.removed.map(i=>`<div class="item gone" data-site="${i.site}" style="--c:${cvar(SITES[i.site].cat)}"><div class="sw"></div><div><div class="nm">${SITES[i.site].name}<span class="chg gone">Finished</span></div><div class="tx">Listed last week, not this week: ${i.text}</div></div></div>`).join('');
  html+=`</section>`;
  html+=`<section><h2>Long-term closures <b>${LONG_TERM.length}</b></h2>${LONG_TERM.map(l=>row(l,true)).join('')}</section>`;
  if(elsewhere.length) html+=`<section><h2>Elsewhere in the city <b>${elsewhere.length}</b></h2>${elsewhere.map(i=>row(i)).join('')}</section>`;
  if(u.region&&u.region.length) html+=`<section class="region"><h2>Around the region</h2>${u.region.map(r=>`<div class="r"><b>${r.title}</b><span>${r.text}</span></div>`).join('')}</section>`;
  html+=`<div class="note">${u.notes} Source: NZTA / Te Wai Takamori o Te Awa Kairangi roadworks email of ${fmtDate(u.emailDate)}. Street alignments from OpenStreetMap; extents are approximate.</div>`;
  side.innerHTML=html;
  side.querySelectorAll('.item').forEach(el=>{ const go=()=>select(el.dataset.site,true); el.addEventListener('click',go); el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}}); });
}
function renderLegend(){ document.getElementById('legend').innerHTML=Object.entries(CATS).map(([k,c])=>`<div style="--c:${cvar(k)}"><i class="${c.sw==='dash'?'dash':''}"></i>${c.label}</div>`).join(''); }
function setWeek(i){ wi=i; activeSite=null; document.getElementById('card').classList.remove('on'); renderSide(); drawWorks(); }
document.getElementById('prev').onclick=()=>setWeek(Math.max(0,wi-1));
document.getElementById('next').onclick=()=>setWeek(Math.min(UPDATES.length-1,wi+1));
document.getElementById('diff').onclick=e=>{ showDiff=!showDiff; e.currentTarget.setAttribute('aria-pressed',showDiff); renderSide(); drawWorks(); };

renderLegend(); renderSide(); drawWorks(); fit();
</script>
</body>
</html>
